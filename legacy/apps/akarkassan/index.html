<style>
/* Layout: arbetsbord. Smal toppram med period och import, flikar, tabeller i egna scrollytor. Registreringsskylt-blå som accent, takskyltens gul för det som kräver åtgärd. */
:root{

  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151A; --panel:#161F27; --panel2:#1B252E; --ink:#E5EAEE; --muted:#97A3AD; --line:#2A3641; --line2:#222D37;
  --accent:#7AA8E6; --accent-ink:#0D1A2A; --accent-soft:#1C2E45; --sign:#F2B935; --sign-soft:#3A2F12; --sign-ink:#F6D78A;
  --ok:#6CC596; --ok-soft:#173326; --bad:#F08A73; --bad-soft:#3D1F19; --night:#A6B2F0; --night-soft:#232A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151A; --panel:#161F27; --panel2:#1B252E; --ink:#E5EAEE; --muted:#97A3AD; --line:#2A3641; --line2:#222D37;
  --accent:#7AA8E6; --accent-ink:#0D1A2A; --accent-soft:#1C2E45; --sign:#F2B935; --sign-soft:#3A2F12; --sign-ink:#F6D78A;

/* bars */

/* ldl-rader */

<script>
/* ===== Åkarkassan beräkningsmotor (ren JS, inga beroenden) ===== */
const ENG = (() => {
  const DEF = {
    procent: 35, semester: 12, utbetDag: 25, utbetDagProv: 10, utbSamma: true, kontEfterFran: '2026-10', broAndel: 35, broPris: 201, cphPris: 17.04, inklPickup: true, inklSturup: true, bomBortLon: true,
    momsKlass: [25, 12, 6, 0, 0], dagStart: 4, dagSlut: 16,
    redovForarandel: 40, agAvgift: 31.42, broMarginalMin: 20
  };
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const pad = n => String(n).padStart(2, '0');
  const normReg = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const toDate = s => { const m = String(s).match(/(\d{4})-(\d\d)-(\d\d)[ T]+(\d\d):(\d\d)(?::(\d\d))?/); return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)) : null; };
  const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const tstr = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };

  function decode(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  }

  /* Megtax/FlexMate löneunderlag (LDL.txt). Belopp i öre. */
  function parseLDL(text) {
    const shifts = []; let cur = null; const warn = [];
    text.split(/\r?\n/).forEach((line, i) => {
      const f = line.split(';');
      if (f[0] === '01' && f.length >= 30) {
        const n = k => (+f[k] || 0) / 100;
        const s = {
          id: f[6] + '-' + f[1] + '-' + f[2], rap: f[1], start: f[2], slut: f[3], rast: +f[4] || 0,
          forare: f[5], bilId: f[6], regnr: (f[7] || '').trim(), reg: normReg(f[7]), orgnr: f[8], foretag: f[9],
          turer: +f[12] || 0, passKm: (+f[13] || 0) / 10, betKm: (+f[14] || 0) / 10,
          kont: n(15), kred: n(16), kontDricks: n(17), kredDricks: n(18),
          kontKl: [n(20), n(21), n(22), n(23), n(24)], kredKl: [n(25), n(26), n(27), n(28), n(29)], pay: []
        };
        const a = toDate(s.start), b = toDate(s.slut);
        if (!a || !b) { warn.push('Rad ' + (i + 1) + ': kunde inte läsa tider'); cur = null; return; }
        s.a = a; s.b = b; s.tim = Math.max(0, (b - a) / 36e5 - s.rast / 60);
        if (s.kont + s.kred === 0 && s.turer === 0) { cur = null; return; } // tomma testpass
        shifts.push(s); cur = s;
      } else if (f[0] === '02' && cur) {
        const vals = f.slice(1).map(x => x.trim()).filter(x => x !== '');
        const count = +vals[vals.length - 1] || 0, amount = (+vals[vals.length - 2] || 0) / 100;
        cur.pay.push({ kod: vals[0], namn: vals.slice(1, vals.length - 2).join(' ') || vals[0], belopp: amount, antal: count });
        if (vals[0] === '999') cur.bom = (cur.bom || 0) + amount;
      }
    });
    return { shifts, warn };
  }

  /* Rader från en Øresundsbro-faktura (text per rad). */
  function parseBro(lines) {
    let kurs = null; const rows = [];
    for (const l of lines) {
      const k = l.match(/DKK\s+[\d\s]+,\d\d\s+(\d{1,3},\d{2})\s+25,00/);
      if (k && !kurs) kurs = parseFloat(k[1].replace(',', '.'));
      const m = l.match(/(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)(?:\s+(\d\d:\d\d:\d\d))?\s+(.+?)\s+(SEK|DKK)\s+([\d\s]*\d,\d\d)\s*$/);
      if (!m) continue;
      const rest = m[3];
      const regM = rest.match(/\b([A-Z]{3}\s?\d{2}[A-Z0-9])\s*\//) || rest.match(/\b([A-Z]{3}\s?\d{2}[A-Z0-9])\b/);
      const typ = /Klass|SV\/DK|DK\/SV/i.test(rest) ? 'bro' : 'avgift';
      const desc = (rest.match(/(SV\/DK Klass \d|DK\/SV Klass \d|Pick-up fee[^A-Z]*Zone\d|Pick-up fee)/i) || [typ === 'bro' ? 'Bro' : 'Avgift'])[0];
      rows.push({ ts: m[1], ts2: m[2] || null, t: toDate(m[1]), desc, reg: regM ? normReg(regM[1]) : '', typ, valuta: m[4], belopp: parseFloat(m[5].replace(/\s/g, '').replace(',', '.')), text: l.trim() });
    }
    return { rows, kurs: kurs || null };
  }

  /* Swedavia Malmö Airport (Sturup): block per bil, rader med in- och utpassage. Pris inkl moms. */
  function parseSturup(lines) {
    const rows = []; let reg = '', bil = '';
    for (const l of lines) {
      const h = l.match(/(?:Bil\s+(\d+)\s+)?\b([A-Z]{3}\s?\d{2}[A-Z0-9])\s+\(\d+\)/);
      if (h) { reg = normReg(h[2]); bil = h[1] || ''; continue; }

  /* Avräkning (faktura) från Taxi Malmö AB till åkeriet. */
  function parseAvrakning(lines) {
    const money = t => { const m = t.match(/(-?\d{1,3}(?: \d{3})*,\d\d)$/); return m ? parseFloat(m[1].replace(/\s/g, '').replace(',', '.')) : null; };
    const rows = []; let nr = '', datum = '', attBetala = null;
    for (const l0 of lines) {
      const l = l0.trim();
      const fn = l.match(/^(?:Fakturanummer\s+)?(\d{5})\s+\d{7}\s+(\d{4}-\d\d-\d\d)/) || l.match(/^Fakturanummer\s+(\d{5})$/); if (fn && !nr) nr = fn[1];
      const fd = l.match(/Fakturadatum\s+(\d{4}-\d\d-\d\d)/); if (fd) datum = fd[1]; if (fn && fn[2]) datum = fn[2];
      const ab = l.match(/^ATT BETALA(?: SEK)?\s+(-?[\d ]+,\d\d)$/); if (ab) attBetala = parseFloat(ab[1].replace(/\s/g, '').replace(',', '.'));
      const m = l.match(/^(\d{1,2})\s+(.*)$/); if (!m) continue;
      const art = +m[1]; if (![1, 8, 15, 16, 17, 50, 51, 52, 53, 54, 55, 59].includes(art)) continue;
      let sum = money(m[2]); if (sum == null) continue;
      const bil = (m[2].match(/[Bb]il (\d{3})/) || m[2].match(/^\D*\d{4}\s(\d{3})\s/) || [])[1] || '';
      let antal = null;
      if ([1, 8, 15, 16, 17].includes(art)) {
        const ap = art <= 8 ? m[2].match(/(?:^|\s)(\d+) (\d{1,2} \d{3},\d\d|\d{1,3},\d\d) /) : m[2].match(/(?:^|\s)(\d+) (\d{1,3},\d\d) /);
        if (ap) { antal = +ap[1]; const apris = parseFloat(ap[2].replace(/\s/g, '').replace(',', '.'));
          const mm = m[2].match(/\s(\d) (\d{1,3}(?: \d{3})*,\d\d)$/); // en ensam momskod före summan
          if (mm && Math.abs(antal * apris - sum) > 1) { const alt = parseFloat(mm[2].replace(/\s/g, '').replace(',', '.')); if (Math.abs(antal * apris - alt) < Math.abs(antal * apris - sum)) sum = alt; } }
      }
      const text = { 1: 'Växelavgift', 8: 'Taklampa hyra', 15: 'Sturup passeringar', 16: 'Øresundsbron', 17: 'CPH parkering', 50: 'Krediter persontransport', 51: 'Krediter bud', 52: 'Kontokort', 53: 'Serviceavgifter', 54: 'Krediter utland', 55: 'Appbetalningar', 59: 'Förskottsbetalning' }[art];
      rows.push({ art, text, bil, antal, summa: sum });
    }
    return { nr, datum, attBetala, rows };
  }

  // Skatteverkets textfil allmanna-tabeller-manad.txt: "30B33  15201  15300 2279 2186 1215 2279 3832 3832"
  function parseSkattetabell(text) {

    text.split(/\r?\n/).forEach(l => {
      if (!/^30[B%]\d\d/.test(l)) return;
      const tab = l.slice(3, 5), typ = l[2], to = +l.slice(12, 19), cols = [0, 1, 2, 3, 4, 5].map(i => +l.slice(19 + i * 5, 24 + i * 5));

    });

  }

  function unpackTabell(s) { if (!s) return null; const [b, p] = s.split('|'); const f = x => x ? x.split(';').map(r => r.split(',').map(Number)) : []; return { B: f(b), P: f(p) }; }
  function compactTabell(s) { // "to:c1,..;%to:.." till {B,P}
    const t = { B: [], P: [] }; s.trim().split(';').forEach(x => { const pct = x[0] === '%'; const [to, c] = x.replace('%', '').split(':'); (pct ? t.P : t.B).push([+to, ...c.split(',').map(Number)]); }); return t;
  }

    if (!t || brutto <= 0) return 0; const k = Math.min(6, Math.max(1, kol || 1)); const b = Math.floor(brutto);
    if (t.B.length && b <= t.B[t.B.length - 1][0]) { const r = t.B.find(r => b <= r[0]); return r ? r[k] : 0; }
    const r = t.P.find(r => r[0] === 0 || b <= r[0]) || t.P[t.P.length - 1]; return r ? Math.floor(b * r[k] / 100) : 0;
  }

  /* Koppla passager till pass enbart på Megtax start- och sluttid för samma bil.

async function importSkatt(file) {
  const T = ENG.parseSkattetabell(ENG.decode(await file.arrayBuffer())); const keys = Object.keys(T);
  if (!keys.length) { toast('Filen ser inte ut som Skatteverkets månadstabeller.'); return; }
  const ar = (file.name.match(/20\d\d/) || [utbMan('procent').slice(0, 4)])[0];
  const tabeller = Object.fromEntries(keys.map(k => [k, ENG.packTabell(T[k])])); S.skatt = tabeller; S.skattAr = ar;
  try { localStorage.setItem('ak_skatt', JSON.stringify({ ar, tabeller })); } catch (e) {}
  if (S.db) { try { await S.db.collection('data/users/' + S.uid).doc('skatt').set({ ar, tabeller }); } catch (e) { toast('Kunde inte spara tabellerna: ' + (e.message || e.code)); return; } }
  render(); toast(keys.length + ' skattetabeller inlästa');
}
async function importForare(file) {
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); let n = 0;
    wb.SheetNames.forEach(sn => { const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false });
      const hi = rows.findIndex(r => r && r.some(c => /operator license/i.test(c || ''))); if (hi < 0) return;
      const h = rows[hi].map(x => String(x || '').toLowerCase()); const iL = h.findIndex(x => x.includes('operator license')), iF = h.findIndex(x => x.includes('first')), iN = h.findIndex(x => x.includes('last'));
      rows.slice(hi + 1).forEach(r => { const id = String(r[iL] || '').trim(); if (!/^\d{5,7}$/.test(id)) return; const nm = [r[iF], r[iN]].filter(Boolean).join(' ').trim(); const f = S.settings.forare[id] = S.settings.forare[id] || {}; if (!f.namn && nm) { f.namn = nm; n++; } }); });
    saveSettings(); render(); toast(n ? n + ' namn ifyllda' : 'Hittade inga nya namn i filen');
  } catch (e) { toast('Kunde inte läsa förarlistan: ' + e.message); }
}

  R.rows.forEach(r => { const f = S.settings.forare[r.id] || {}; lon.push([r.id, namnFor(r.id), f.anst || '', r.modell, r.pass, ENG.r2(r.tim), r.ink, ENG.r2(r.bom), ENG.r2(r.bud), r.exkl, r.proc, r.broN, r.broApris, -r.broAvdr, r.sem, r.ob, r.bonus, r.fast, r.brutto, r.kontant, r.forskott, r.agAvg, r.kredDr]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lon), 'Löneunderlag');
  const kas = [['Bil', 'Datum', 'Vecka', 'Pass', 'Förare', 'Kassa', 'Kontant', 'Kredit', 'Kastrup', 'Sturup', 'Kassa exkl. bro', 'Bolagets andel', 'Hos förare']];
  Object.values(R.bilar).forEach(b => Object.values(b.dagar).sort((p, q) => p.datum < q.datum ? -1 : 1).forEach(d => ['dag', 'natt'].forEach(k => { const x = d[k]; if (!x) return; kas.push([b.regnr, d.datum, d.vecka, k === 'dag' ? 'Dag' : 'Kväll', x.forare.map(f => namnFor(f) || f).join(', '), x.kassa, x.kont, x.kred, x.bro, ENG.r2(x.stu), ENG.r2(x.exBro), ENG.r2(x.andel), ENG.r2(x.hosForare)]); })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(kas), 'Kassaredovisning');
  const br = [['Tid', 'Bil', 'Typ', 'Dag/kväll', 'Förare', 'Namn', 'Koppling', 'Kostnad', 'Avdrag lön']];
  R.bro.forEach(p => br.push([p.ts, p.reg, p.desc, p.period, p.forare || '', namnFor(p.forare), p.metod, p.kost, p.iLon ? ENG.r2(p.kost * c.broAndel / 100) : 0]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(br), 'Bro och Sturup');
  const ps = [['Nr', 'Bil', 'Förarnr', 'Namn', 'Start', 'Slut', 'Timmar', 'Kontant', 'Kredit', 'Exkl. moms']];
  S.shifts.forEach(s => ps.push([s.rap, s.regnr, s.forare, namnFor(s.forare), s.start, s.slut, ENG.r2(s.tim), s.kont, s.kred, ENG.r2(ENG.exkl(s, c))]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ps), 'Körpass');
  const data = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  const name = 'Lön och kassa ' + (S.settings.foretag || '').replace(/[^\wåäöÅÄÖ ]/g, '') + ' ' + S.period + '.xlsx';
  try { const dl = await window.claude?.use?.('downloads'); if (!dl) { toast('Nedladdning är inte tillgänglig i den här vyn'); return; } await dl.save({ filename: name, data: new Uint8Array(data) }); toast('Sparad'); }
  catch (e) { if (e && e.code === 'declined') return; toast('Kunde inte spara filen' + (e && e.code ? ' (' + e.code + ')' : '')); }
}

<!-- Mobilkort v1 (2026-10-07): breda tabeller blir kort på skärmar under 700 px. Rör inga data. -->
<style id="mc-style">
@media (max-width:700px){
  :root{--mc-card:var(--surface,var(--panel,var(--card,#fff)));--mc-sunk:var(--sunk,var(--panel2,var(--bg,#f4f4f4)));--mc-line:var(--line,#ddd);--mc-muted:var(--muted,#666);--mc-mark:var(--accent,var(--amber,var(--brand,#e9a200)))}
  input,select,textarea{font-size:16px!important}
  .mc-wrap{overflow:visible!important;border:0!important;background:transparent!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
  table.mc,table.mc>tbody,table.mc>tfoot{display:block;width:100%!important;min-width:0!important}
  table.mc>thead,table.mc>tbody>tr.mc-head{display:none}
  table.mc>tbody>tr,table.mc>tfoot>tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-flow:row dense;gap:6px 12px;background:var(--mc-card);border:1px solid var(--mc-line);border-radius:10px;padding:10px 12px;margin:0 0 8px;position:relative;height:auto}
  table.mc>*>tr>td,table.mc>*>tr>th{display:block;padding:0!important;border:0!important;text-align:left!important;white-space:normal!important;min-width:0!important;width:auto!important;max-width:none!important;overflow-wrap:anywhere;background:transparent!important;position:static!important;height:auto}
  table.mc td::before,table.mc th::before{content:attr(data-l);display:block;font:500 11px/1.3 var(--f-body,system-ui,sans-serif);letter-spacing:0;text-transform:none;color:var(--mc-muted);margin-bottom:1px}
  table.mc .mc-e{display:none!important}
  table.mc .mc-w{grid-column:1/-1}
  table.mc .mc-t{grid-column:1/-1;order:-2;font-weight:600;font-size:15px;padding-bottom:6px!important;border-bottom:1px solid var(--mc-line)!important;margin-bottom:2px}
  table.mc .mc-t::before,table.mc .mc-nl::before{display:none}
  table.mc td input:not([type=checkbox]):not([type=radio]),table.mc td select,table.mc td textarea{width:100%!important;min-width:0!important;max-width:100%!important}
  table.mc td button,table.mc td .btn{margin:2px 6px 2px 0}
  table.mc tr.mc-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  table.mc tr.mc-pair{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px}
  table.mc tr.mc-pair>td{flex:0 1 auto}
  table.mc tr.mc-pair>.mc-t{border:0!important;padding:0!important;margin:0;font-size:13.5px;font-weight:500;flex:1}
  table.mc tr.mc-pair>:not(.mc-t){text-align:right!important;flex:none;max-width:45%}
  table.mc tr.mc-pair>*::before{display:none}
  table.mc tr.mc-full{display:block;padding:0;border:0;background:transparent;margin:-2px 0 14px}
  table.mc tr.mc-full>*{padding:10px 0 0 10px!important;border-left:3px solid var(--mc-mark)!important}
  table.mc tr.mc-full>*::before{display:none}
  table.mc tr.mc-trip{padding:8px 12px;gap:3px 12px;grid-auto-flow:row}
  table.mc tr.mc-trip>.mc-t{grid-column:auto;border:0!important;padding:0!important;margin:0;font-size:14px}
  table.mc tr.mc-trip>.mc-tid{order:-1;text-align:right!important;font-weight:600}

}
</style>
<script id="mc-script">
(() => {
  const C = window.MC || {}, MQ = matchMedia('(max-width:700px)');
  const TITEL = (C.titel || ['Förare', 'Namn', 'Bolag', 'Åkare', 'Kund', 'Ägare', 'Benämning', 'Beskrivning', 'Post', 'Kostnad', 'Text']).map(s => s.toLowerCase());
  const NUM = /^[−\-+]?\s?[\d\s.,:]+\s?(kr|%|st|km|mkr|tkr|sek|usd)?$/i;
  const wrapOf = tb => { let e = tb.parentElement; for (let i = 0; e && i < 3; i++, e = e.parentElement) { const o = getComputedStyle(e).overflowX; if (o === 'auto' || o === 'scroll') return e; } return null; };
  function heads(tb) {
    let hrs = tb.tHead ? [...tb.tHead.rows] : [];
    if (!hrs.length) for (const r of tb.rows) { if (r.cells.length && [...r.cells].every(c => c.tagName === 'TH')) { hrs.push(r); r.classList.add('mc-head'); } else break; }
    const G = [];
    hrs.forEach((r, ri) => { G[ri] = G[ri] || []; let c = 0;
      for (const th of r.cells) { while (G[ri][c] !== undefined) c++; const t = th.textContent.replace(/\s+/g, ' ').trim();
        for (let dr = 0; dr < (th.rowSpan || 1); dr++) { G[ri + dr] = G[ri + dr] || []; for (let dc = 0; dc < (th.colSpan || 1); dc++) G[ri + dr][c + dc] = t; }
        c += th.colSpan || 1; } });
    const n = Math.max(0, ...G.map(r => r.length)), h = [];
    for (let c = 0; c < n; c++) { const parts = []; for (const r of G) { const t = r[c]; if (t && !parts.includes(t)) parts.push(t); } h.push(parts.join(' ')); }
    return h;
  }
  function label(tb) {
    const H = heads(tb), hl = H.map(s => s.toLowerCase());
    const prio = TITEL.map(t => hl.findIndex(h => h === t || h.startsWith(t + ' '))).filter(i => i >= 0);
    const rows = [...(tb.tBodies.length ? [...tb.tBodies].flatMap(b => [...b.rows]) : []), ...(tb.tFoot ? [...tb.tFoot.rows] : [])];
    for (const tr of rows) {
      if (tr.classList.contains('mc-head')) continue;
      tr.classList.remove('mc-full', 'mc-pair', 'mc-3', 'mc-trip');
      const cells = [...tr.cells];
      if (cells.length === 1 && (cells[0].colSpan || 1) >= Math.max(2, H.length - 1)) { tr.classList.add('mc-full'); continue; }
      let col = 0; const info = cells.map(td => { const x = { td, col, ctl: !!td.querySelector('input,select,textarea,button,a.btn'), txt: td.textContent.replace(/\s+/g, ' ').trim() }; col += td.colSpan || 1; return x; });
      for (const x of info) {
        x.td.classList.remove('mc-e', 'mc-w', 'mc-t', 'mc-nl', 'mc-tid');
        x.td.dataset.l = H[x.col] || '';
        if (!x.ctl && !x.txt && !x.td.querySelector('img,svg')) x.td.classList.add('mc-e');
        if (!x.td.dataset.l) x.td.classList.add('mc-nl');
        if ((x.td.colSpan || 1) > 1 || x.txt.length > 26 || x.td.querySelectorAll('button,a.btn').length > 1 || x.td.querySelector('textarea')) x.td.classList.add('mc-w');
      }
      const ok = x => x && !x.ctl && x.txt;
      let t = null;
      for (const i of prio) { const x = info.find(y => y.col === i); if (ok(x)) { t = x; break; } }
      if (!t) t = info.find(y => ok(y) && !NUM.test(y.txt)) || null;
      if (t) t.td.classList.add('mc-t');
      if (tr.classList.contains('sum') || tr.classList.contains('total') || /^(summa|totalt?)\b/i.test(t ? t.txt : '')) tr.classList.add('mc-sum');
      const iD = hl.indexOf('datum'), iT = hl.indexOf('tid');
      const tid = iT >= 0 && info.find(y => y.col === iT && y.txt);
      if (t && tid && t.col === iD) { tr.classList.add('mc-trip'); tid.td.classList.add('mc-tid', 'mc-nl'); }
      const vis = info.filter(y => !y.td.classList.contains('mc-e'));
      if (vis.length <= 2 && t) tr.classList.add('mc-pair');
      else if (!tr.classList.contains('mc-trip') && vis.filter(y => !/mc-(t|w)\b/.test(y.td.className) && !y.td.querySelector('input,select')).length >= 5) tr.classList.add('mc-3');
    }
  }
  function scan() {
    if (!MQ.matches) return;
    document.querySelectorAll('table').forEach(tb => {
      if (tb.closest('.mc-skip')) return;
      if (!tb.classList.contains('mc')) {
        const w = wrapOf(tb), avail = (w || tb.parentElement).clientWidth;
        if (!avail || tb.scrollWidth <= avail + 2) return;
        tb.classList.add('mc'); if (w) w.classList.add('mc-wrap');
      }
      label(tb);
    });
    const over = [...document.querySelectorAll('table.mc td:not(.mc-w):not(.mc-e)')].filter(td => td.scrollWidth > td.clientWidth + 2);
    over.forEach(td => td.classList.add('mc-w'));
    if (C.sticky) document.querySelectorAll(C.sticky).forEach(e => e.classList.add('mc-sticky'));
    if (C.stickyBox) { const box = document.querySelector(C.stickyBox), keep = box && box.querySelector(C.keep); if (box && keep) { box.style.position = 'sticky'; box.style.zIndex = '20'; box.style.top = 'calc(env(safe-area-inset-top,0px) - ' + (box.offsetHeight - keep.offsetHeight) + 'px)'; } }
  }
  MQ.addEventListener('change', () => { if (!MQ.matches && C.stickyBox) { const box = document.querySelector(C.stickyBox); if (box) { box.style.position = ''; box.style.top = ''; box.style.zIndex = ''; } } });
  let raf = 0; const q = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(scan); };
  new MutationObserver(q).observe(document.body, { childList: true, subtree: true });
  MQ.addEventListener('change', q); addEventListener('resize', q); q();
})();
</script>
